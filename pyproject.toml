[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localvideo-workflows"
version = "0.1.0"
description = "Reproducible local video and multi-character dialogue workflows, tools and agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "soundfile>=0.12,<1", "aiohttp>=3.10,<4", "psutil>=6,<8"]

[project.scripts]
localvideo = "localvideo.cli:main"

[project.urls]
Repository = "https://github.com/wome0001/LocalVideo"
Documentation = "https://github.com/wome0001/LocalVideo/tree/main/docs"
Issues = "https://github.com/wome0001/LocalVideo/issues"

[tool.setuptools.packages.find]
where = ["src"]
